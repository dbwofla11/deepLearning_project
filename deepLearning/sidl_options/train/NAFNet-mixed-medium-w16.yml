
path:
  root: C:/DNN/deepLearning/NAFNet
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

name: NAFNet-mixed-medium-w16

model_type: ImageRestorationModel

scale: 1
num_gpu: 1
manual_seed: 42

datasets:

  train:
    name: sidl-mixed-train
    type: PairedImageDataset

    dataroot_gt: G:/.shortcut-targets-by-id/1rmr4AHuOKBYVcTFWdTOrfmNqHNMQRXzT/mixed/target
    dataroot_lq: G:/.shortcut-targets-by-id/1rmr4AHuOKBYVcTFWdTOrfmNqHNMQRXzT/mixed/input

    io_backend:
      type: disk

    gt_size: 64

    use_flip: true
    use_rot: true
    use_shuffle: true

    num_worker_per_gpu: 4
    batch_size_per_gpu: 64

  val:
    name: sidl-mixed-medium-val
    type: PairedImageDataset

    dataroot_gt: G:/.shortcut-targets-by-id/15heQpPoDquJ_skh0A0Sw0H7XTqAVciCY/mixed/medium/target
    dataroot_lq: G:/.shortcut-targets-by-id/15heQpPoDquJ_skh0A0Sw0H7XTqAVciCY/mixed/medium/input

    io_backend:
      type: disk

network_g:
  type: NAFNetLocal

  width: 16

  enc_blk_nums: [1, 1, 1, 8]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

train:

  optim_g:
    type: AdamW

    lr: !!float 1e-4

    weight_decay: !!float 1e-4

    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR

    T_max: 20000

    eta_min: !!float 1e-7

  total_iter: 20000

  warmup_iter: -1

  pixel_opt:
    type: PSNRLoss

    loss_weight: 1

    reduction: mean

val:

  val_freq: !!float 1000

  save_img: true

  metrics:

    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:

  print_freq: !!float 1000

  save_checkpoint_freq: !!float 1000

  use_tb_logger: true

  wandb:
    project: ~

    resume_id: ~

dist_params:

  backend: gloo

  port: 29500
