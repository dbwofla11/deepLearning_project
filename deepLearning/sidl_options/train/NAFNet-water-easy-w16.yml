
path:
  root: C:/DNN/deepLearning/NAFNet
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

name: NAFNet-water-easy-w16

model_type: ImageRestorationModel

scale: 1
num_gpu: 1
manual_seed: 42

datasets:

  train:
    name: sidl-water-train
    type: PairedImageDataset

    dataroot_gt: G:/.shortcut-targets-by-id/1EEFsAOy22ywrq7X8hbG_yng8rxLpRcoh/water/target
    dataroot_lq: G:/.shortcut-targets-by-id/1EEFsAOy22ywrq7X8hbG_yng8rxLpRcoh/water/input

    io_backend:
      type: disk

    gt_size: 64

    use_flip: true
    use_rot: true
    use_shuffle: true

    num_worker_per_gpu: 1
    batch_size_per_gpu: 4

  val:
    name: sidl-water-easy-val
    type: PairedImageDataset

    dataroot_gt: G:/.shortcut-targets-by-id/1BsFgeHgPmT1UOKl78ikwUNLB7YjXVRpF/water/easy/target
    dataroot_lq: G:/.shortcut-targets-by-id/1BsFgeHgPmT1UOKl78ikwUNLB7YjXVRpF/water/easy/input

    io_backend:
      type: disk

network_g:
  type: NAFNetLocal

  width: 16

  enc_blk_nums: [1, 1, 1, 8]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

train:

  optim_g:
    type: AdamW

    lr: !!float 1e-3

    weight_decay: !!float 1e-3

    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR

    T_max: 20000

    eta_min: !!float 1e-7

  total_iter: 20000

  warmup_iter: -1

  pixel_opt:
    type: PSNRLoss

    loss_weight: 1

    reduction: mean

val:

  val_freq: !!float 5000

  save_img: true

  metrics:

    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:

  print_freq: !!float 500

  save_checkpoint_freq: !!float 5000

  use_tb_logger: true

  wandb:
    project: ~

    resume_id: ~

dist_params:

  backend: gloo

  port: 29500
