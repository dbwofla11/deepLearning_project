  strict_load_g: true

name: TEST-Residual-mixed-easy-net_g_7000

model_type: ImageRestorationModel

scale: 1
num_gpu: 1

datasets:

  test:
    name: sidl-mixed-easy-test

    type: PairedImageDataset

    dataroot_gt: G:/.shortcut-targets-by-id/16M_VTZyM-1-mp0UmdTs2kbK0_ro4GkE9/mixed/easy/input

    dataroot_lq: G:/.shortcut-targets-by-id/16M_VTZyM-1-mp0UmdTs2kbK0_ro4GkE9/mixed/easy/input

    io_backend:
      type: disk

network_g:
  type: NAFNetLocal

  width: 16

  enc_blk_nums: [1, 1, 1, 8]

